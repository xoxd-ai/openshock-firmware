# Softproxy fork: runs the host tests of the SP-46 local lockdown and the gateway lockouts, the command paths and the radio path (SOFTPROXY.md). Linear: TIN-7545, TIN-7125.
name: softproxy-host-test

on:
  pull_request:
    branches:
      - 'softproxy/**'
      - 'feat/tin-7545-softproxy-caps'
    types: [opened, reopened, synchronize]
  push:
    branches:
      - 'softproxy/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-test:
    name: softproxy host test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # The commit platformio.ini pins. The command path and radio path tests need its headers.
      - uses: actions/checkout@v6
        with:
          repository: google/flatbuffers
          ref: 8b02fe6178427b96aea25396b53ea4ae8cadd7d8
          path: .deps/flatbuffers
          persist-credentials: false

      - name: Build and run the local lockdown test
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -Iinclude test/native/test_local_lockdown.cpp -o local_lockdown_test
          ./local_lockdown_test

      - name: Build and run the command path test
        run: |
          WS=src/message_handlers/websocket
          SRC="src/CommandHandler.cpp $WS/Local.cpp $WS/Gateway.cpp"
          SRC="$SRC $WS/gateway/ShockerCommandList.cpp $WS/gateway/Trigger.cpp $WS/local/SetRfTxPinCommand.cpp"
          SRC="$SRC src/serial/command_handlers/rftransmit.cpp src/serial/command_handlers/rftxpin.cpp src/radio/rmt/*Encoder.cpp"
          g++ -std=c++20 -O1 -Itest/native/stubs -Iinclude -I.deps/flatbuffers/include test/native/test_command_paths.cpp $SRC -o command_paths_test
          ./command_paths_test

      - name: Build and run the radio path test
        run: |
          # Once per PiShock RF TX default: 12 for Pishock-2023, 15 for Pishock-Lite-2021.
          FLAGS="-std=c++20 -O1 -pthread -DSOFTPROXY_RADIO_TEST -DOPENSHOCK_FW_CHIP_ESP32 -DOPENSHOCK_LED_GPIO=2"
          INC="-Itest/native/radio_stubs -Itest/native/stubs -Iinclude -I.deps/flatbuffers/include"
          SRC="src/CommandHandler.cpp src/WebSocketDeFragger.cpp src/radio/RFTransmitter.cpp"
          SRC="$SRC src/radio/rmt/Sequence.cpp src/radio/rmt/*Encoder.cpp"
          for TX in 12 15; do
            g++ $FLAGS -DOPENSHOCK_RF_TX_GPIO=$TX $INC -Wl,--wrap=malloc test/native/test_radio_path.cpp $SRC -o radio_path_test
            ./radio_path_test
          done
